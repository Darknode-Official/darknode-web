name = "darknode-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# Weekly email digest: Mondays 14:00 UTC (worker/digest.js). Staging has no cron.
[triggers]
crons = ["0 14 * * 1"]

# Non-secret config. Set DARKNODE_URL here (or as a secret) once your GPU-hosted
# Darknode model is up; until then the flagship falls back to Gemini.
[vars]
GEMINI_FALLBACK_MODEL = "gemini-flash-lite-latest"
FIREBASE_PROJECT_ID = "sentinel-b4194"
DIGEST_CRON = "on"
DIGEST_API_BASE = "https://darknode-proxy.darknode-ai.workers.dev"
# DARKNODE_URL = "https://your-gpu-box/v1/chat/completions"

# Secrets are NOT stored here. Set them once with:
#   npx wrangler secret put GEMINI_KEY        # required — powers Darknode's fallback
#   npx wrangler secret put GEMINI_KEY_2      # optional — backup Google key used when GEMINI_KEY is spent/rejected
#   npx wrangler secret put SMART_KEY         # optional — the DI tab's Smart mode (/api/smart); falls back to GEMINI_KEY
#   npx wrangler secret put GROQ_KEY          # optional — for the free Groq models
#   npx wrangler secret put OPENROUTER_KEY    # optional — for the free OpenRouter models
#   npx wrangler secret put MISTRAL_KEY       # optional — for the free Mistral models
#   npx wrangler secret put DARKNODE_KEY      # optional — only if your GPU box needs auth
#   npx wrangler secret put ANTHROPIC_KEY     # optional — Claude models for signed-in users (provider "anthropic")
# Set CLAUDE_ACCESS = "admin" under [vars] to limit Claude to admin-claim accounts.

# Server-enforced VAULT: one SQLite-backed Durable Object per team vault (free plan).
[[durable_objects.bindings]]
name = "VAULT"
class_name = "VaultDO"

# Cloud-synced security graph (Phase B1): one SQLite-backed Durable Object per workspace.
[[durable_objects.bindings]]
name = "GRAPH"
class_name = "GraphDO"

# Continuous monitoring (Deck D4): one SQLite-backed Durable Object per workspace.
# Monitors run on the DO's own alarms, so live checks keep running with no page open.
[[durable_objects.bindings]]
name = "MONITOR"
class_name = "MonitorDO"

# Ingest API (Deck D5): one SQLite-backed Durable Object per workspace holding its
# server-issued API keys (as SHA-256 hashes) and the ingest queue.
[[durable_objects.bindings]]
name = "INGEST"
class_name = "IngestDO"

# Per-principal rate limits (Phase 0): one in-memory Durable Object per signed-in
# user or API key. Anonymous callers stay on the per-isolate IP limiter.
[[durable_objects.bindings]]
name = "RATE"
class_name = "RateLimiterDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VaultDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GraphDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["MonitorDO"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["IngestDO"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["RateLimiterDO"]

# Staging Worker: `npx wrangler deploy --env staging` publishes darknode-proxy-staging
# with its own Durable Object namespaces, so a PR can be exercised end to end without
# touching production data. Bindings and vars are not inherited, so they repeat here.
[env.staging]
name = "darknode-proxy-staging"

[env.staging.triggers]
crons = []

[env.staging.vars]
GEMINI_FALLBACK_MODEL = "gemini-flash-lite-latest"
FIREBASE_PROJECT_ID = "sentinel-b4194"
DIGEST_CRON = "off"
DIGEST_API_BASE = "https://darknode-proxy-staging.darknode-ai.workers.dev"

[[env.staging.durable_objects.bindings]]
name = "VAULT"
class_name = "VaultDO"

[[env.staging.durable_objects.bindings]]
name = "GRAPH"
class_name = "GraphDO"

[[env.staging.durable_objects.bindings]]
name = "MONITOR"
class_name = "MonitorDO"

[[env.staging.durable_objects.bindings]]
name = "INGEST"
class_name = "IngestDO"

[[env.staging.durable_objects.bindings]]
name = "RATE"
class_name = "RateLimiterDO"
