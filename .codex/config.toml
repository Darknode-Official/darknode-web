[mcp_servers.aidesigner]
url = "https://api.aidesigner.ai/api/v1/mcp"

[mcp_servers.github]
command = "npx"
args = ["@modelcontextprotocol/server-github"]

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]

[mcp_servers.shadcn]
command = "npx"
args = [
    "shadcn-mcp@latest",
    "--stdio",
]
