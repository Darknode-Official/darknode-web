<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentinel — Security Console</title>
  <meta name="description" content="Sentinel is an all-in-one security console: tools, threat intel, cheat sheets, a code workbench, and local AI — on the web and desktop.">
  <meta name="theme-color" content="#070a12">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sentinel">
  <meta property="og:title" content="Sentinel — Security Console">
  <meta property="og:description" content="Tools, threat intel, cheat sheets & local AI — on the web and desktop.">
  <meta property="og:image" content="https://raw.githubusercontent.com/Darknode-Official/sentinel-web/main/public/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sentinel — Security Console">
  <meta name="twitter:description" content="Tools, threat intel, cheat sheets & local AI — on the web and desktop.">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/Darknode-Official/sentinel-web/main/public/og.png">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="bootscreen" aria-hidden="true">
    <canvas class="boot-rain" id="bootrain"></canvas>
    <div class="boot-grid"></div>
    <div class="boot-sweep"></div>
    <div class="boot-inner">
      <div class="boot-ring"></div><div class="boot-ring r2"></div>
      <div class="boot-logo glitch" data-text="&gt;_ SENTINEL">&gt;_ SENTINEL</div>
      <div class="boot-tag">S E C U R I T Y &nbsp; C O N S O L E</div>
      <div class="boot-lines">
        <div style="--d:.25s">[<span class="bok">OK</span>] loading tool arsenal &amp; payloads</div>
        <div style="--d:.50s">[<span class="bok">OK</span>] arming exploit &amp; vuln databases</div>
        <div style="--d:.75s">[<span class="bok">OK</span>] indexing google dorks &amp; VMs</div>
        <div style="--d:1.00s">[<span class="bok">OK</span>] connecting local AI</div>
        <div style="--d:1.25s">[<span class="bok">OK</span>] establishing secure console</div>
        <div style="--d:1.55s" class="boot-go">sentinel@web:~$ <span class="boot-cur">&#9608;</span></div>
      </div>
      <div class="boot-barwrap"><div class="boot-bar"><span></span></div><span class="boot-pct" id="bootpct">0%</span></div>
    </div>
  </div>
  <div id="app">
    <header id="topbar">
      <a class="brand" href="/"><img class="brand-mark" src="/favicon.svg" alt=""><span>Sentinel</span></a>
      <span id="user-slot"><!-- sign-in button / avatar rendered by js/auth.js --></span>
    </header>
    <div id="announcement" class="banner" hidden></div>
    <main id="view"><p class="loading">Loading&hellip;</p></main>
  </div>

  <!-- Boot splash: Matrix-style digital rain (runs until the splash fades). -->
  <script>
    (function () {
      var c = document.getElementById("bootrain"); if (!c || !c.getContext) return;
      var ctx = c.getContext("2d"), G = 15;
      function size() { c.width = c.offsetWidth; c.height = c.offsetHeight; }
      size(); addEventListener("resize", size);
      var chars = "01<>[]{}#$%&*/\\|=+アカサタナハマヤラワ0123456789ABCDEF";
      var cols = Math.floor(c.width / G), drops = [], raf;
      for (var i = 0; i < cols; i++) drops[i] = Math.random() * -50;
      function draw() {
        ctx.fillStyle = "rgba(5,7,13,0.10)"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.font = G + "px monospace";
        for (var i = 0; i < cols; i++) {
          var ch = chars[(Math.random() * chars.length) | 0], y = drops[i] * G;
          ctx.fillStyle = Math.random() > 0.97 ? "#dffbff" : "rgba(0,212,255,0.8)";
          ctx.fillText(ch, i * G, y);
          if (y > c.height && Math.random() > 0.975) drops[i] = 0; else drops[i]++;
        }
        raf = requestAnimationFrame(draw);
      }
      draw(); setTimeout(function () { cancelAnimationFrame(raf); }, 3000);
      var pct = document.getElementById("bootpct");
      if (pct) { var t0 = performance.now(); (function tick() { var p = Math.min(100, Math.round(((performance.now() - t0) / 2300) * 100)); pct.textContent = p + "%"; if (p < 100) requestAnimationFrame(tick); })(); }
      var logo = document.querySelector(".boot-logo");
      if (logo) { var target = ">_ SENTINEL", pool = "!<>-_\\/[]{}=+*^?#01ABCDEF", total = 38, frame = 0;
        var id = setInterval(function () { frame++; var o = ""; for (var i = 0; i < target.length; i++) { if (target[i] === " ") { o += " "; continue; } o += (i < (frame / total) * target.length) ? target[i] : pool[(Math.random() * pool.length) | 0]; } logo.textContent = o; if (frame >= total) { clearInterval(id); logo.textContent = target; } }, 26); }
    })();
  </script>

  <!-- App entry. Loads Firebase (js/firebase.js), resolves the signed-in
       user's role, then renders the right view. ultraplan fills in the rest. -->
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
