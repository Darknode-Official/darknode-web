  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Darknode">
  <meta property="og:title" content="Darknode — Learn Cybersecurity by Doing It">
  <meta property="og:description" content="AI-powered security tools, threat intel, and autonomous agents.">
  <meta property="og:image" content="https://darknode.ai/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Darknode — Learn Cybersecurity by Doing It">
  <meta name="twitter:description" content="AI-powered security tools, threat intel, and autonomous agents.">
  <meta name="twitter:image" content="https://darknode.ai/og.png">
  <link rel="dns-prefetch" href="https://www.gstatic.com">

  <style>body{margin:0;background:var(--bg);color:var(--txt);
  font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
#bootscreen{position:fixed;inset:0;z-index:99999;background:radial-gradient(1200px 600px at 50% 20%,#0a0f1c,#05070d 70%);
  display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--mono,ui-monospace,"JetBrains Mono",monospace);
  animation:bootOut .55s ease 2.5s forwards}
.boot-grid{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(color-mix(in srgb,var(--acc,#00d4ff) 12%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--acc,#00d4ff) 12%,transparent) 1px,transparent 1px);
  background-size:34px 34px;-webkit-mask-image:radial-gradient(60% 50% at 50% 45%,#000,transparent 80%);mask-image:radial-gradient(60% 50% at 50% 45%,#000,transparent 80%)}
.boot-inner{position:relative;text-align:center}
.boot-logo{font-size:clamp(2.2rem,7vw,4rem);font-weight:800;letter-spacing:.06em;
  background:linear-gradient(135deg,var(--acc,#00d4ff),var(--acc-2,#7c5cff));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px color-mix(in srgb,var(--acc,#00d4ff) 55%,transparent));animation:bootPulse 2.4s ease-in-out infinite}</style>
  <link rel="stylesheet" href="/css/styles.css" media="all">
  <link rel="modulepreload" href="/js/auth.js">
  <link rel="prefetch" href="/data/topics.json">
</head>
<body>
  <div id="bootscreen" aria-hidden="true">
    <canvas class="boot-rain" id="bootrain"></canvas>
    <div class="boot-grid"></div>
    <div class="boot-sweep"></div>
    <div class="boot-inner">
      <div class="boot-ring"></div><div class="boot-ring r2"></div>
      <div class="boot-logo glitch" data-text="&gt;_ DARKNODE">&gt;_ DARKNODE</div>
      <div class="boot-tag">C Y B E R S E C U R I T Y &nbsp; L E A R N I N G &nbsp; P L A T F O R M</div>
      <div class="boot-lines">
        <div style="--d:.25s">[<span class="bok">OK</span>] initializing AI security engine</div>
        <div style="--d:.50s">[<span class="bok">OK</span>] loading threat intelligence &amp; exploit databases</div>
        <div style="--d:.75s">[<span class="bok">OK</span>] connecting autonomous agents</div>
        <div style="--d:1.00s">[<span class="bok">OK</span>] arming Nexus AI engine</div>
        <div style="--d:1.25s">[<span class="bok">OK</span>] darknode.ai online</div>
        <div style="--d:1.55s" class="boot-go">darknode@ai:~$ <span class="boot-cur">&#9608;</span></div>
      </div>
      <div class="boot-barwrap"><div class="boot-bar"><span></span></div><span class="boot-pct" id="bootpct">0%</span></div>
    </div>
  </div>
  <div id="app">
    <header id="topbar">
      <a class="brand" href="/"><img class="brand-mark" src="/favicon.svg" alt=""><span>Darknode</span></a>
      <span id="user-slot"><!-- sign-in button / avatar rendered by js/auth.js --></span>
    </header>
    <div id="announcement" class="banner" hidden></div>
    <main id="view"><p class="loading">Loading&hellip;</p></main>
  </div>

  <!-- Boot splash: warp-speed neon hyperjump — 3D streaks + charging energy core,
       accelerating into the splash's warp-out. -->
  <script>
    (function () {
      var c = document.getElementById("bootrain"); if (!c || !c.getContext) return;
      var ctx = c.getContext("2d");
      function size() { c.width = c.offsetWidth; c.height = c.offsetHeight; }
      size(); addEventListener("resize", size);
      var reduce = false; try { reduce = matchMedia("(prefers-reduced-motion:reduce)").matches; } catch (e) {}
      // 3D neon streak field rushing toward the camera (cyan / violet / gold).
      var N = 340, stars = [], raf, t0 = performance.now();
      function mk(s) { s = s || {};
        s.x = (Math.random() - .5) * c.width; s.y = (Math.random() - .5) * c.height;
        s.z = Math.random() * c.width; s.pz = s.z;
        var r = Math.random(); s.col = r < .6 ? "0,234,255" : r < .85 ? "176,38,255" : "255,210,63";
        return s; }
      for (var i = 0; i < N; i++) stars.push(mk());
      function draw() {
        var el = (performance.now() - t0) / 1000;
        var speed = 5 + el * el * 8;                 // ramp: gentle boot → hyperjump
        ctx.fillStyle = "rgba(5,7,13,0.30)"; ctx.fillRect(0, 0, c.width, c.height);
        var cx = c.width / 2, cy = c.height / 2, foc = Math.min(c.width, c.height) * 0.9;
        ctx.lineCap = "round";
        for (var i = 0; i < N; i++) {
          var s = stars[i]; s.pz = s.z; s.z -= speed;
          if (s.z < 1) { mk(s); continue; }
          var px = cx + s.x * (foc / s.pz), py = cy + s.y * (foc / s.pz);
          var k = foc / s.z, x = cx + s.x * k, y = cy + s.y * k;
          var a = Math.min(1, (c.width - s.z) / c.width * 1.4);
          ctx.strokeStyle = "rgba(" + s.col + "," + a + ")";
          ctx.lineWidth = Math.max(.4, (1 - s.z / c.width) * 3.2);
          ctx.shadowBlur = 12; ctx.shadowColor = "rgba(" + s.col + ",.9)";
          ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
        }
        ctx.shadowBlur = 0;
        var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120 + el * 55);   // charging core
        g.addColorStop(0, "rgba(0,234,255," + (0.10 + Math.min(.3, el * .07)) + ")");
        g.addColorStop(1, "rgba(0,234,255,0)");
        ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
        if (!reduce) raf = requestAnimationFrame(draw);
      }
      draw(); setTimeout(function () { cancelAnimationFrame(raf); }, 3000);
      // Preload heavy modules during boot animation
      fetch("/data/topics.json").catch(function(){});
      var pct = document.getElementById("bootpct");
      if (pct) { var s0 = performance.now(); (function tick() { var p = Math.min(100, Math.round(((performance.now() - s0) / 2300) * 100)); pct.textContent = p + "%"; if (p < 100) requestAnimationFrame(tick); })(); }
      var logo = document.querySelector(".boot-logo");
      if (logo) { var target = ">_ DARKNODE", pool = "!<>-_\\/[]{}=+*^?#01ABCDEF", total = 38, frame = 0;
        var id = setInterval(function () { frame++; var o = ""; for (var i = 0; i < target.length; i++) { if (target[i] === " ") { o += " "; continue; } o += (i < (frame / total) * target.length) ? target[i] : pool[(Math.random() * pool.length) | 0]; } logo.textContent = o; if (frame >= total) { clearInterval(id); logo.textContent = target; } }, 26); }
    })();
  </script>

  <!-- App entry. Loads Firebase (js/firebase.js), resolves the signed-in
       user's role, then renders the right view. ultraplan fills in the rest. -->
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
