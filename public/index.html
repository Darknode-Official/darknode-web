<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentinel — Security Console</title>
  <meta name="description" content="Sentinel is an all-in-one security console: tools, threat intel, cheat sheets, a code workbench, and local AI — on the web and desktop.">
  <meta name="theme-color" content="#070a12">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sentinel">
  <meta property="og:title" content="Sentinel — Security Console">
  <meta property="og:description" content="Tools, threat intel, cheat sheets & local AI — on the web and desktop.">
  <meta property="og:image" content="https://raw.githubusercontent.com/SpartanKing18/sentinel-web/main/public/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sentinel — Security Console">
  <meta name="twitter:description" content="Tools, threat intel, cheat sheets & local AI — on the web and desktop.">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/SpartanKing18/sentinel-web/main/public/og.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="modulepreload" href="/js/auth.js">
  <link rel="prefetch" href="/js/learn-hub.js" as="script">
</head>
<body>
  <div id="bootscreen" aria-hidden="true">
    <canvas class="boot-rain" id="bootrain"></canvas>
    <div class="boot-grid"></div>
    <div class="boot-sweep"></div>
    <div class="boot-inner">
      <div class="boot-ring"></div><div class="boot-ring r2"></div>
      <div class="boot-logo glitch" data-text="&gt;_ SENTINEL">&gt;_ SENTINEL</div>
      <div class="boot-tag">S E C U R I T Y &nbsp; C O N S O L E</div>
      <div class="boot-lines">
        <div style="--d:.25s">[<span class="bok">OK</span>] loading tool arsenal &amp; payloads</div>
        <div style="--d:.50s">[<span class="bok">OK</span>] arming exploit &amp; vuln databases</div>
        <div style="--d:.75s">[<span class="bok">OK</span>] indexing google dorks &amp; VMs</div>
        <div style="--d:1.00s">[<span class="bok">OK</span>] connecting local AI</div>
        <div style="--d:1.25s">[<span class="bok">OK</span>] establishing secure console</div>
        <div style="--d:1.55s" class="boot-go">sentinel@web:~$ <span class="boot-cur">&#9608;</span></div>
      </div>
      <div class="boot-barwrap"><div class="boot-bar"><span></span></div><span class="boot-pct" id="bootpct">0%</span></div>
    </div>
  </div>
  <div id="app">
    <header id="topbar">
      <a class="brand" href="/"><img class="brand-mark" src="/favicon.svg" alt=""><span>Sentinel</span></a>
      <span id="user-slot"><!-- sign-in button / avatar rendered by js/auth.js --></span>
    </header>
    <div id="announcement" class="banner" hidden></div>
    <main id="view"><p class="loading">Loading&hellip;</p></main>
  </div>

  <!-- Boot splash: warp-speed neon hyperjump — 3D streaks + charging energy core,
       accelerating into the splash's warp-out. -->
  <script>
    (function () {
      var c = document.getElementById("bootrain"); if (!c || !c.getContext) return;
      var ctx = c.getContext("2d");
      function size() { c.width = c.offsetWidth; c.height = c.offsetHeight; }
      size(); addEventListener("resize", size);
      var reduce = false; try { reduce = matchMedia("(prefers-reduced-motion:reduce)").matches; } catch (e) {}
      // 3D neon streak field rushing toward the camera (cyan / violet / gold).
      var N = 340, stars = [], raf, t0 = performance.now();
      function mk(s) { s = s || {};
        s.x = (Math.random() - .5) * c.width; s.y = (Math.random() - .5) * c.height;
        s.z = Math.random() * c.width; s.pz = s.z;
        var r = Math.random(); s.col = r < .6 ? "0,234,255" : r < .85 ? "176,38,255" : "255,210,63";
        return s; }
      for (var i = 0; i < N; i++) stars.push(mk());
      function draw() {
        var el = (performance.now() - t0) / 1000;
        var speed = 5 + el * el * 8;                 // ramp: gentle boot → hyperjump
        ctx.fillStyle = "rgba(5,7,13,0.30)"; ctx.fillRect(0, 0, c.width, c.height);
        var cx = c.width / 2, cy = c.height / 2, foc = Math.min(c.width, c.height) * 0.9;
        ctx.lineCap = "round";
        for (var i = 0; i < N; i++) {
          var s = stars[i]; s.pz = s.z; s.z -= speed;
          if (s.z < 1) { mk(s); continue; }
          var px = cx + s.x * (foc / s.pz), py = cy + s.y * (foc / s.pz);
          var k = foc / s.z, x = cx + s.x * k, y = cy + s.y * k;
          var a = Math.min(1, (c.width - s.z) / c.width * 1.4);
          ctx.strokeStyle = "rgba(" + s.col + "," + a + ")";
          ctx.lineWidth = Math.max(.4, (1 - s.z / c.width) * 3.2);
          ctx.shadowBlur = 12; ctx.shadowColor = "rgba(" + s.col + ",.9)";
          ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
        }
        ctx.shadowBlur = 0;
        var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120 + el * 55);   // charging core
        g.addColorStop(0, "rgba(0,234,255," + (0.10 + Math.min(.3, el * .07)) + ")");
        g.addColorStop(1, "rgba(0,234,255,0)");
        ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
        if (!reduce) raf = requestAnimationFrame(draw);
      }
      draw(); setTimeout(function () { cancelAnimationFrame(raf); }, 3000);
      // Preload heavy modules during boot animation
      fetch("/js/learn-hub.js").catch(function(){});
      var pct = document.getElementById("bootpct");
      if (pct) { var s0 = performance.now(); (function tick() { var p = Math.min(100, Math.round(((performance.now() - s0) / 2300) * 100)); pct.textContent = p + "%"; if (p < 100) requestAnimationFrame(tick); })(); }
      var logo = document.querySelector(".boot-logo");
      if (logo) { var target = ">_ SENTINEL", pool = "!<>-_\\/[]{}=+*^?#01ABCDEF", total = 38, frame = 0;
        var id = setInterval(function () { frame++; var o = ""; for (var i = 0; i < target.length; i++) { if (target[i] === " ") { o += " "; continue; } o += (i < (frame / total) * target.length) ? target[i] : pool[(Math.random() * pool.length) | 0]; } logo.textContent = o; if (frame >= total) { clearInterval(id); logo.textContent = target; } }, 26); }
    })();
  </script>

  <!-- App entry. Loads Firebase (js/firebase.js), resolves the signed-in
       user's role, then renders the right view. ultraplan fills in the rest. -->
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
