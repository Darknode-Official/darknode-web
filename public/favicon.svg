<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="glow" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="url(#glow)" stroke-opacity="0.3"/>
  <!-- Central node -->
  <circle cx="32" cy="32" r="8" fill="url(#glow)" opacity="0.9"/>
  <circle cx="32" cy="32" r="11" fill="none" stroke="url(#glow)" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Satellite nodes -->
  <circle cx="16" cy="18" r="4" fill="#00d4ff" opacity="0.7"/>
  <circle cx="48" cy="18" r="4" fill="#7c5cff" opacity="0.7"/>
  <circle cx="16" cy="46" r="4" fill="#7c5cff" opacity="0.7"/>
  <circle cx="48" cy="46" r="4" fill="#00d4ff" opacity="0.7"/>
  <!-- Connection lines -->
  <line x1="20" y1="20" x2="28" y2="28" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="44" y1="20" x2="36" y2="28" stroke="#7c5cff" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="20" y1="44" x2="28" y2="36" stroke="#7c5cff" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="44" y1="44" x2="36" y2="36" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Outer ring nodes -->
  <circle cx="32" cy="10" r="3" fill="#00d4ff" opacity="0.5"/>
  <circle cx="32" cy="54" r="3" fill="#7c5cff" opacity="0.5"/>
  <line x1="32" y1="13" x2="32" y2="24" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.35"/>
  <line x1="32" y1="40" x2="32" y2="51" stroke="#7c5cff" stroke-width="1" stroke-opacity="0.35"/>
</svg>
