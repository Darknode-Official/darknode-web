<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Square app icon (apple-touch-icon.png 180, icon-192.png, icon-512.png): the favicon mark on navy, inside the maskable safe zone.
       rsvg-convert -w 180 -h 180 public/icon.svg -o public/apple-touch-icon.png (and -w/-h 192, 512 for icon-192.png, icon-512.png) -->
  <rect width="100" height="100" fill="#0f172a"/>
  <g transform="translate(20,20) scale(0.6)">
    <g fill="none" stroke="#F2F5F9" stroke-width="5" stroke-linejoin="round">
      <rect x="12" y="12" width="30" height="30" rx="8"/>
      <rect x="58" y="12" width="30" height="30" rx="8"/>
      <rect x="12" y="58" width="30" height="30" rx="8"/>
      <rect x="58" y="58" width="30" height="30" rx="8"/>
    </g>
    <rect x="65" y="65" width="16" height="16" rx="4" fill="#EAB308"/>
  </g>
</svg>
